name: Build EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile C++
        run: g++ nilai_siswa.cpp -o nilai_siswa.exe

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: nilai-siswa-exe
          path: nilai_siswa.exe
